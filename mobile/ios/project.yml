# XcodeGen project definition. The .xcodeproj is generated from this file (`xcodegen generate`)
# on the build machine, so it never has to be edited by hand.
name: GlassMeet
options:
  bundleIdPrefix: com.hyper3dp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  GlassMeet:
    type: application
    platform: iOS
    sources:
      - path: GlassMeet
        excludes:
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      # The Icon Composer icon (Xcode 26). It sits beside the asset catalog, whose AppIcon set
      # stays as the fallback; both are named AppIcon.
      - path: GlassMeet/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    scheme: {}
    postBuildScripts:
      # One-off diagnostic, read from the artifact sizes: an empty simulator app means the
      # .icon bundle isn't a Resources file of type iconcomposer; an empty device app means Info.plist lacks
      # the URL scheme, display name or launch screen.
      - name: Bundle diagnostic
        basedOnDependencyAnalysis: false
        script: |
          app="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          p="$app/Info.plist"
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            pbx="$PROJECT_FILE_PATH/project.pbxproj"
            if ! grep -q 'AppIcon.icon in Resources' "$pbx" || ! grep 'path = AppIcon.icon' "$pbx" | grep -q 'iconcomposer'; then rm -rf "$app"/*; fi
          else
            scheme=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$p" 2>/dev/null)
            name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$p" 2>/dev/null)
            if [ "$scheme" != "glassmeet" ] || [ "$name" != "GlassMeet" ] || ! /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$p" >/dev/null 2>&1; then rm -rf "$app"/*; fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyper3dp.glassmeet
        PRODUCT_NAME: GlassMeet
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Info.plist holds the glassmeet:// URL scheme; Xcode adds the generated keys below to it
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GlassMeet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
