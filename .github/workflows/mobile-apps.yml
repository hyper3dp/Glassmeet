name: Build mobile apps

# Builds the native iOS app (SwiftUI) on a macOS machine and the native Android app (Kotlin,
# Jetpack Compose) on Linux, so no Mac or Android Studio is needed locally. When the
# APPETIZE_API_TOKEN (or APPITIZE_API) secret is set, each build is uploaded to Appetize, which runs it on a cloud
# iPhone or Android phone in the browser.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apps.yml'
  workflow_dispatch:

jobs:
  ios:
    name: iOS (simulator build)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the iOS Simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GlassMeet.xcodeproj \
            -scheme GlassMeet \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E '(error|warning: .*deprecated|BUILD (SUCCEEDED|FAILED))' || true
          if [ ! -d build/Build/Products/Debug-iphonesimulator/GlassMeet.app ]; then
            grep -E ': error: ' xcodebuild.log | sort -u | head -10 | while IFS= read -r line; do echo "::error title=Swift::$line"; done
            exit 1
          fi

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: mobile/ios/xcodebuild.log

      - name: Zip the app
        run: |
          cd mobile/ios/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/GlassMeet-ios-simulator.zip" GlassMeet.app

      - uses: actions/upload-artifact@v4
        with:
          name: GlassMeet-ios-simulator
          path: GlassMeet-ios-simulator.zip

      # A real-iPhone build, left unsigned: an Apple ID signs it when it is installed
      # (Xcode, or a sideloading tool such as Sideloadly or AltStore on Windows).
      - name: Build an unsigned iPhone .ipa
        working-directory: mobile/ios
        run: |
          xcodebuild build \
            -project GlassMeet.xcodeproj \
            -scheme GlassMeet \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > device.log 2>&1 || true
          app=build-device/Build/Products/Release-iphoneos/GlassMeet.app
          if [ ! -d "$app" ]; then
            grep -E ': error: ' device.log | sort -u | head -10 | while IFS= read -r line; do echo "::error title=Swift (device)::$line"; done
            exit 1
          fi
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qr "$GITHUB_WORKSPACE/GlassMeet-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GlassMeet-unsigned-ipa
          path: GlassMeet-unsigned.ipa

      - name: Upload to Appetize (cloud iPhone)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN || secrets.APPITIZE_API }}
          APPETIZE_KEY: ${{ vars.APPETIZE_IOS_KEY || '4b3x6akp4arpb3xmgvmidck7my' }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then echo "::notice title=Appetize::No Appetize token secret; upload skipped."; exit 0; fi
          url="https://api.appetize.io/v1/apps${APPETIZE_KEY:+/$APPETIZE_KEY}"
          curl -sS --fail-with-body -X POST "$url" -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@GlassMeet-ios-simulator.zip" -F "platform=ios" -o appetize.json
          key=$(python3 -c 'import json; print(json.load(open("appetize.json"))["publicKey"])')
          echo "Cloud iPhone: https://appetize.io/app/$key" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cloud iPhone::https://appetize.io/app/$key"

  # A signed .ipa for TestFlight / App Store (or ad hoc devices). Needs a paid Apple Developer
  # account and these repository secrets; until they all exist, the job skips its build steps.
  #   IOS_DIST_CERT_P12           base64 of the Apple Distribution certificate (.p12)
  #   IOS_DIST_CERT_PASSWORD      the .p12 password
  #   IOS_PROVISIONING_PROFILE    base64 of the matching provisioning profile (.mobileprovision)
  #   APPLE_TEAM_ID               the 10-character team ID
  #   IOS_EXPORT_METHOD           optional: app-store-connect (default), ad-hoc, release-testing
  ios-signed:
    name: iOS (signed .ipa)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check for signing secrets
        id: check
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signed iOS build::Skipped: add IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE and APPLE_TEAM_ID secrets to build a signed .ipa."
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - name: Install the certificate and profile
        if: steps.check.outputs.ok == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      - name: Archive and export
        if: steps.check.outputs.ok == 'true'
        working-directory: mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild archive \
            -project GlassMeet.xcodeproj -scheme GlassMeet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GlassMeet.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            > archive.log 2>&1 || { grep -E ': error: |error:' archive.log | sort -u | head -10 | while IFS= read -r l; do echo "::error title=Archive::$l"; done; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.hyper3dp.glassmeet</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GlassMeet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/GlassMeet.ipa" "$GITHUB_WORKSPACE/GlassMeet-signed.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: GlassMeet-signed-ipa
          path: GlassMeet-signed.ipa

      - name: Remove the signing keychain
        if: always() && steps.check.outputs.ok == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Show the failure as annotations, which anyone can read without signing in
            summary=$(sed -n '/What went wrong/,/Try:/p' gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            [ -n "$summary" ] && echo "::error title=Gradle::$summary"
            grep -E '^e: ' gradle.log | head -9 | while IFS= read -r line; do echo "::error title=Kotlin::$line"; done
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: GlassMeet-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to Appetize (cloud Android phone)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN || secrets.APPITIZE_API }}
          APPETIZE_KEY: ${{ vars.APPETIZE_ANDROID_KEY || '5wtmxqfkukoh2kkicaev2z72sa' }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then echo "::notice title=Appetize::No Appetize token secret; upload skipped."; exit 0; fi
          url="https://api.appetize.io/v1/apps${APPETIZE_KEY:+/$APPETIZE_KEY}"
          curl -sS --fail-with-body -X POST "$url" -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@mobile/android/app/build/outputs/apk/debug/app-debug.apk" -F "platform=android" -o appetize.json
          key=$(python3 -c 'import json; print(json.load(open("appetize.json"))["publicKey"])')
          echo "Cloud Android phone: https://appetize.io/app/$key" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cloud Android phone::https://appetize.io/app/$key"
